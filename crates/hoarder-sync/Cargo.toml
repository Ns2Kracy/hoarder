[package]
name = "hoarder-sync"
version = "0.1.0"
description = "Source-to-vault sync runtime for Hoarder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["sync", "vault", "runtime"]
categories = ["filesystem"]

[dependencies]
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
hex = "0.4.3"
hoarder-connectors = { path = "../hoarder-connectors" }
hoarder-core = { path = "../hoarder-core" }
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
