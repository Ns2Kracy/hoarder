[package]
name = "hoarder-server"
version = "0.1.0"
description = "Local API, persistence, and server control plane for Hoarder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["axum", "sqlite", "sync"]
categories = ["web-programming", "database"]

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
hoarder-connectors = { path = "../hoarder-connectors" }
hoarder-core = { path = "../hoarder-core" }
hoarder-sync = { path = "../hoarder-sync" }
rust-embed = "8.11.0"
sea-orm = { version = "2.0.0-rc.38", default-features = false, features = [
  "entity-registry",
  "macros",
  "runtime-tokio-rustls",
  "schema-sync",
  "sqlx-sqlite",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.10", features = [
  "compression-gzip",
  "cors",
  "propagate-header",
  "request-id",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["chrono", "preserve_path_order"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

[dev-dependencies]
uuid = { version = "1.23.1", features = ["serde", "v4"] }
