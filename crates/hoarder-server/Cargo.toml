[package]
name = "hoarder-server"
version = "0.1.0"
description = "Local API, persistence, and server control plane for Hoarder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["axum", "sqlite", "sync"]
categories = ["web-programming", "database"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hoarder-connectors = { workspace = true }
hoarder-core = { workspace = true }
hoarder-sync = { workspace = true }
rust-embed = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-scalar = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
