[package]
name = "hoarder-server"
version = "0.1.0"
description = "Local API, persistence, and server control plane for Hoarder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["axum", "sqlite", "sync"]
categories = ["web-programming", "database"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hoarder-connectors = { workspace = true }
hoarder-core = { workspace = true }
hoarder-sync = { workspace = true }
mime_guess = "2.0.5"
rust-embed = "8.11.0"
sea-orm = { version = "2.0.0-rc.38", default-features = false, features = [
  "entity-registry",
  "macros",
  "runtime-tokio-rustls",
  "schema-sync",
  "sqlx-sqlite",
  "with-chrono",
  "with-json",
  "with-uuid",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.10", features = [
  "compression-gzip",
  "cors",
  "propagate-header",
  "request-id",
] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "5.5.0", features = ["chrono", "preserve_path_order"] }
utoipa-scalar = { version = "0.3.0", features = ["axum"] }

[dev-dependencies]
uuid = { workspace = true }
