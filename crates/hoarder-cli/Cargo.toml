[package]
name = "hoarder-cli"
version = "0.1.0"
description = "Command-line interface for Hoarder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["cli", "sync", "vault"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "hoarder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
hoarder-connectors = { workspace = true }
hoarder-core = { workspace = true }
hoarder-server = { path = "../hoarder-server" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
hoarder-sync = { workspace = true }
uuid = { workspace = true }
