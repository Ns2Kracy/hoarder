[package]
name = "hoarder-cli"
version = "0.1.0"
description = "Command-line interface for Hoarder"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["cli", "sync", "vault"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "hoarder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
hoarder-connectors = { path = "../hoarder-connectors" }
hoarder-core = { path = "../hoarder-core" }
hoarder-server = { path = "../hoarder-server" }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
hoarder-sync = { path = "../hoarder-sync" }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
