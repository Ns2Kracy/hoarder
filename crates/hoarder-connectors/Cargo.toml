[package]
name = "hoarder-connectors"
version = "0.1.0"
description = "Connector contracts and adapters for Hoarder sources"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["sync", "connector", "opendal"]
categories = ["filesystem", "network-programming"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hoarder-core = { workspace = true }
opendal = { version = "0.56.0", default-features = false, features = [
  "executors-tokio",
  "reqwest-rustls-tls",
  "services-fs",
  "services-s3",
  "services-sftp",
  "services-webdav",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }

[dev-dependencies]
axum = { workspace = true }
uuid = { workspace = true }
