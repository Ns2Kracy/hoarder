name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build embedded web assets
        working-directory: web
        run: bun run build

      - name: Clippy
        run: cargo clippy --all-targets --all-features --message-format=short

      - name: Test
        run: cargo test

  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Format
        working-directory: web
        run: bun run fmt:check

      - name: Lint
        working-directory: web
        run: bun run lint

      - name: Type check
        working-directory: web
        run: bun run check

      - name: Test
        working-directory: web
        run: bun test

      - name: Build
        working-directory: web
        run: bun run build

  package-smoke:
    name: Release binary smoke test
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build embedded web assets
        working-directory: web
        run: bun run build

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test binary
        run: |
          ./target/release/hoarder --help
          ./target/release/hoarder source templates
