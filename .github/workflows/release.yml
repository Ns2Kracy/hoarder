name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: hoarder-linux-x86_64
            binary_name: hoarder
            archive_name: hoarder-linux-x86_64.tar.gz
            archive_command: tar -czf hoarder-linux-x86_64.tar.gz -C package hoarder README.md README.zh-CN.md LICENSE
          - os: macos-13
            artifact_name: hoarder-macos-x86_64
            binary_name: hoarder
            archive_name: hoarder-macos-x86_64.tar.gz
            archive_command: tar -czf hoarder-macos-x86_64.tar.gz -C package hoarder README.md README.zh-CN.md LICENSE
          - os: macos-14
            artifact_name: hoarder-macos-arm64
            binary_name: hoarder
            archive_name: hoarder-macos-arm64.tar.gz
            archive_command: tar -czf hoarder-macos-arm64.tar.gz -C package hoarder README.md README.zh-CN.md LICENSE
          - os: windows-latest
            artifact_name: hoarder-windows-x86_64
            binary_name: hoarder.exe
            archive_name: hoarder-windows-x86_64.zip
            archive_command: Compress-Archive -Path package/hoarder.exe,package/README.md,package/README.zh-CN.md,package/LICENSE -DestinationPath hoarder-windows-x86_64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Build release binary
        run: mise run release:build

      - name: Stage package
        shell: bash
        run: |
          mkdir -p package
          cp "target/release/${{ matrix.binary_name }}" package/
          cp README.md README.zh-CN.md LICENSE package/

      - name: Archive package
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
        run: ${{ matrix.archive_command }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t artifacts < <(find dist -type f | sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${artifacts[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${artifacts[@]}" --generate-notes
          fi
