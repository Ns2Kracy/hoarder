name: Benchmarks And Soak Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark-and-soak:
    name: Local sync benchmark and soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache cargo state
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-soak-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-soak-${{ runner.os }}-

      - name: Run benchmark and soak gate
        env:
          HOARDER_BENCH_FILES: 500
          HOARDER_BENCH_BYTES: 1024
          HOARDER_SOAK_ITERATIONS: 40
          HOARDER_SOAK_FILES: 100
        run: mise run ci:soak
