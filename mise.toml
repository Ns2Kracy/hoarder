[tools]
bun = "1.3.13"
rust = "1.96.0"

[tasks.default]
description = "List available project tasks"
run = "mise tasks ls"

[tasks.setup]
description = "Install project dependencies managed outside Cargo"
run = "mise run web:install"

[tasks.cli]
description = "Run the hoarder CLI; pass CLI args after --"
run = "cargo run -p hoarder-cli -- \"$@\""

[tasks.serve]
description = "Build the embedded web console, then start Hoarder locally"
run = """
mise run web:build
cargo run -p hoarder-cli -- serve "$@"
"""

[tasks."db:sync"]
description = "Synchronize the configured SQLite schema"
run = "cargo run -p hoarder-cli -- db sync"

[tasks."rust:metadata"]
description = "Validate Cargo workspace dependency metadata"
run = "cargo metadata --format-version 1 >/dev/null"

[tasks."rust:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --check"

[tasks."rust:clippy"]
description = "Run strict Rust Clippy checks"
run = "cargo clippy --workspace --all-targets --all-features --message-format=short"

[tasks."rust:test"]
description = "Run the Rust workspace test suite"
run = "cargo test --workspace --quiet"

[tasks."cli:build"]
description = "Build the debug hoarder CLI binary"
run = "cargo build -p hoarder-cli"

[tasks."cli:smoke"]
description = "Smoke-test the debug hoarder CLI binary"
run = """
target/debug/hoarder --help >/dev/null
target/debug/hoarder source templates >/dev/null
target/debug/hoarder db --help >/dev/null
"""

[tasks."web:install"]
description = "Install frontend dependencies from bun.lock"
dir = "web"
run = "bun install --frozen-lockfile"

[tasks."web:dev"]
description = "Start the Vite development server"
dir = "web"
run = "bun run dev"

[tasks."web:build"]
description = "Build the frontend assets embedded by RustEmbed"
dir = "web"
run = "bun run build"

[tasks."web:preview"]
description = "Preview the built frontend assets"
dir = "web"
run = "bun run preview"

[tasks."web:verify"]
description = "Run frontend formatting, linting, type checks, and build"
dir = "web"
run = "bun run verify"

[tasks."web:test"]
description = "Run frontend tests"
dir = "web"
run = "bun test"

[tasks.verify]
description = "Run the full local quality gate"
run = """
mise run rust:metadata
mise run rust:fmt
mise run rust:clippy
mise run rust:test
mise run web:verify
mise run web:test
mise run cli:build
mise run cli:smoke
"""

[tasks."release:build"]
description = "Build the web assets and release hoarder binary"
run = """
mise run web:install
mise run web:build
cargo build -p hoarder-cli --release
"""

[tasks."release:smoke"]
description = "Build and smoke-test the release hoarder binary"
run = """
mise run release:build
target/release/hoarder --help >/dev/null
target/release/hoarder source templates >/dev/null
target/release/hoarder db --help >/dev/null
"""

[tasks."bench:local-fs"]
description = "Run the ignored local filesystem sync benchmark"
run = "cargo test -p hoarder-server --test performance_benchmark -- --ignored --nocapture"

[tasks."soak:local-fs"]
description = "Run the ignored local filesystem sync soak test"
run = "HOARDER_SOAK_ITERATIONS=${HOARDER_SOAK_ITERATIONS:-40} HOARDER_SOAK_FILES=${HOARDER_SOAK_FILES:-100} cargo test -p hoarder-server --test soak_local_fs -- --ignored --nocapture"

[tasks."ci:rust"]
description = "Run the CI Rust quality gate"
run = """
mise run web:install
mise run rust:metadata
mise run rust:fmt
mise run web:build
mise run rust:clippy
mise run rust:test
"""

[tasks."ci:web"]
description = "Run the CI web quality gate"
run = """
mise run web:install
mise run web:verify
mise run web:test
"""

[tasks."ci:soak"]
description = "Run the CI benchmark and soak gate"
run = """
mise run web:install
mise run web:build
mise run bench:local-fs
mise run soak:local-fs
"""
