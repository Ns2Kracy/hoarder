[workspace]
members = [
  "crates/hoarder-core",
  "crates/hoarder-connectors",
  "crates/hoarder-sync",
  "crates/hoarder-server",
  "crates/hoarder-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ns2kracy/hoarder"
rust-version = "1.85"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
future_not_send = { level = "allow", priority = 0 }
multiple_crate_versions = { level = "allow", priority = 0 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
