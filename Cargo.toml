[workspace]
members = [
  "crates/hoarder-core",
  "crates/hoarder-connectors",
  "crates/hoarder-sync",
  "crates/hoarder-server",
  "crates/hoarder-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ns2kracy/hoarder"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8.9"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
hex = "0.4.3"
hoarder-connectors = { path = "crates/hoarder-connectors" }
hoarder-core = { path = "crates/hoarder-core" }
hoarder-sync = { path = "crates/hoarder-sync" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = "1.52.3"
tracing = "0.1.44"
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
future_not_send = { level = "allow", priority = 0 }
multiple_crate_versions = { level = "allow", priority = 0 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.lints.rust]
warnings = "deny"

[profile.release]
strip = "symbols"
lto = "thin"
